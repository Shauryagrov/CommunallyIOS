<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Bank Setup - Communally</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #eafbf0 0%, #f8fffb 45%, #ffffff 100%);
            color: #1f2937;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 18px 45px rgba(24, 160, 88, 0.12), 0 6px 18px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(24, 160, 88, 0.12);
        }
        .icon {
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #b8f5cd 0%, #8fe8b0 100%);
            color: #16974f;
            font-size: 42px;
            box-shadow: 0 14px 30px rgba(46, 204, 113, 0.18);
        }
        h1 {
            font-size: 30px;
            line-height: 1.15;
            margin-bottom: 12px;
            color: #17212b;
        }
        p {
            font-size: 17px;
            line-height: 1.6;
            color: #5b6470;
            margin-bottom: 14px;
        }
        .steps {
            margin-top: 18px;
            padding: 18px 20px;
            border-radius: 18px;
            background: #f5fff8;
            text-align: left;
            color: #1d7f48;
            font-size: 15px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">↻</div>
        <h1>Resume Bank Setup</h1>
        <p>Your Stripe onboarding session expired or needs more information.</p>
        <p>Go back to the Communally app and tap <strong>Connect Bank Account</strong> again to restart the setup.</p>
        <div class="steps">
            1. Return to the app<br>
            2. Open your payment/bank setup screen<br>
            3. Tap <strong>Connect Bank Account</strong> again
        </div>
    </div>
</body>
</html>
